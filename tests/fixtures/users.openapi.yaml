openapi: 3.0.3
info:
  title: Users API
  version: 1.0.0
paths:
  /users:
    get:
      responses:
        "200":
          description: list
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
      responses:
        "201":
          description: created
  /users/{id}:
    get:
      responses:
        "200":
          description: get
    delete:
      responses:
        "204":
          description: deleted
